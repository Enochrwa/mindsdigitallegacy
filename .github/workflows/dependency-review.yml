name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    # Needs the dependency graph, available on public repositories and with Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action fails outright when the repository has the dependency graph switched off. Check first, so
      # the failure says what to do (a repository setting) instead of looking like a broken pull request.
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency review skipped::Turn on the dependency graph: Settings > Advanced Security > Dependency graph. Until then new dependencies are not reviewed automatically."
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
