name: End-to-end tests

# Runs the real website against the in-memory API in a real browser (frontend/playwright.config.ts).
# Not a required check until it has been green for a while: browser tests need a first-run shakedown.

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/e2e.yml"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium) and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # --ignore-scripts: dependency install scripts are a supply-chain attack path.
      - name: Install API dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Install web dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: bun run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
