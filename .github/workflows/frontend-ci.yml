name: Frontend CI

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["backend/**", "docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      # The Lovable-generated code has Prettier formatting drift (131 formatting-only errors).
      # Real lint rules are enforced; formatting is excluded until a deliberate format-only commit
      # (ADR-0001). Do not reformat generated files in feature PRs.
      - name: Lint (formatting rule excluded)
        run: |
          bunx eslint . --rule 'prettier/prettier: off'
      - run: bun run test
      - run: bun run build
